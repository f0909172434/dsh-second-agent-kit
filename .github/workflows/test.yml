name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guard:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify stock Engram through HonestCI
        run: npm run verify:engram
      - name: Reproduce the known migration limitation
        run: npm run test:migration
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engram-evidence-${{ matrix.os }}
          path: reports/
